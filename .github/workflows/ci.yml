name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  raycast:
    name: Lint & Build Raycast Extension
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: raycast
        run: npm ci

      - name: Validate linter
        working-directory: raycast
        run: npm run lint

      - name: Build extension
        working-directory: raycast
        run: npm run build

  go-tui:
    name: Build Go TUI / CLI
    runs-on: macos-latest
    strategy:
      matrix:
        goos: [darwin]
        goarch: [arm64, amd64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build Go binary
        working-directory: tui
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags="-s -w" -o foltty-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/foltty
